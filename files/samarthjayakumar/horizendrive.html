<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HorizenDrive</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8a91a1; --accent:#4f8cff; --danger:#ff5c6c; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:24px 12px; }
  .wrap { width:100%; max-width:640px; }
  h1 { margin:0 0 16px; font-size:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.secondary { background:#2a2f3a; }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .msg { margin-top:12px; font-size:14px; min-height:18px; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }
  .file { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .file:first-child { border-top:0; }
  .file .name { word-break:break-all; }
  .file .size { color:var(--muted); font-size:12px; }
  .file .actions { display:flex; gap:6px; flex-shrink:0; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .hidden { display:none; }
  small { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>HorizenDrive</h1>

  <!-- Login / register -->
  <div id="authView" class="card">
    <label for="apiUrl">Worker URL</label>
    <input id="apiUrl" type="text" placeholder="https://horizendrive.yourname.workers.dev">
    <label for="user">Username</label>
    <input id="user" type="text" autocomplete="username" placeholder="3-32 chars: a-z 0-9 _ -">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="At least 8 characters">
    <div class="row">
      <button id="loginBtn">Log in</button>
      <button id="registerBtn" class="secondary">Create account</button>
    </div>
    <div id="authMsg" class="msg"></div>
  </div>

  <!-- Drive -->
  <div id="driveView" class="hidden">
    <div class="card">
      <div class="top">
        <div>Signed in as <b id="who"></b></div>
        <button id="logoutBtn" class="secondary">Log out</button>
      </div>
    </div>
    <div class="card">
      <label for="fileInput">Upload a file <small>(max 20 MB)</small></label>
      <input id="fileInput" type="file">
      <div class="row"><button id="uploadBtn">Upload</button></div>
      <div id="driveMsg" class="msg"></div>
    </div>
    <div class="card">
      <div class="top"><b>Your files</b><button id="refreshBtn" class="secondary">Refresh</button></div>
      <div id="fileList"><small>Loading...</small></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = null;
let api = "";
const MAX = 20 * 1024 * 1024;

function store(key, val) { try { val === null ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function say(el, text, kind) { el.textContent = text; el.className = "msg " + (kind || ""); }
function baseUrl() { return $("apiUrl").value.trim().replace(/\/+$/, ""); }
function fmt(n) { return n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; }

async function call(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers.Authorization = "Bearer " + token;
  return fetch(api + path, Object.assign({}, opts, { headers }));
}

async function authenticate(kind) {
  api = baseUrl();
  if (!/^https?:\/\//.test(api)) return say($("authMsg"), "Enter your worker URL first.", "err");
  say($("authMsg"), "Working...");
  try {
    const r = await fetch(api + "/api/" + kind, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("user").value.trim(), password: $("pass").value })
    });
    const d = await r.json();
    if (!r.ok) return say($("authMsg"), d.error || "Something went wrong (" + r.status + ")", "err");
    token = d.token;
    store("hd_api", api); store("hd_token", token); store("hd_user", $("user").value.trim().toLowerCase());
    showDrive();
  } catch (e) {
    say($("authMsg"), "Couldn't reach the worker. Check the URL.", "err");
  }
}

function showDrive() {
  $("authView").classList.add("hidden");
  $("driveView").classList.remove("hidden");
  $("who").textContent = load("hd_user") || $("user").value.trim().toLowerCase();
  $("pass").value = "";
  refresh();
}

function logout() {
  token = null; store("hd_token", null);
  $("driveView").classList.add("hidden");
  $("authView").classList.remove("hidden");
  say($("authMsg"), "");
}

async function refresh() {
  $("fileList").innerHTML = "<small>Loading...</small>";
  try {
    const r = await call("/api/files");
    if (r.status === 401) return logout();
    const d = await r.json();
    renderFiles(d.files || []);
  } catch (e) {
    $("fileList").innerHTML = "<small>Couldn't load files.</small>";
  }
}

function renderFiles(files) {
  const box = $("fileList");
  box.innerHTML = "";
  if (!files.length) { box.innerHTML = "<small>No files yet.</small>"; return; }
  for (const f of files) {
    const row = document.createElement("div"); row.className = "file";
    const info = document.createElement("div");
    const n = document.createElement("div"); n.className = "name"; n.textContent = f.name;
    const s = document.createElement("div"); s.className = "size"; s.textContent = fmt(f.size);
    info.append(n, s);
    const act = document.createElement("div"); act.className = "actions";
    const dl = document.createElement("button"); dl.textContent = "Download"; dl.onclick = () => download(f.name);
    const del = document.createElement("button"); del.textContent = "Delete"; del.className = "danger"; del.onclick = () => remove(f.name);
    act.append(dl, del);
    row.append(info, act);
    box.append(row);
  }
}

function safeName(name) {
  let n = name.replace(/[^A-Za-z0-9_.\- ]/g, "_").slice(0, 100);
  if (/^[.]/.test(n)) n = "_" + n.slice(1);
  return n || "file";
}

async function upload() {
  const file = $("fileInput").files[0];
  if (!file) return say($("driveMsg"), "Choose a file first.", "err");
  if (file.size > MAX) return say($("driveMsg"), "That file is over 20 MB.", "err");
  const name = safeName(file.name);
  $("uploadBtn").disabled = true;
  say($("driveMsg"), "Uploading " + name + "...");
  try {
    const r = await call("/api/upload?name=" + encodeURIComponent(name), { method: "PUT", body: file });
    const d = await r.json();
    if (!r.ok) say($("driveMsg"), d.error || "Upload failed (" + r.status + ")", "err");
    else { say($("driveMsg"), "Uploaded " + name, "ok"); $("fileInput").value = ""; refresh(); }
  } catch (e) {
    say($("driveMsg"), "Upload failed.", "err");
  }
  $("uploadBtn").disabled = false;
}

async function download(name) {
  say($("driveMsg"), "Downloading " + name + "...");
  try {
    const r = await call("/api/download?name=" + encodeURIComponent(name));
    if (!r.ok) return say($("driveMsg"), "Download failed (" + r.status + ")", "err");
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a"); a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    say($("driveMsg"), "");
  } catch (e) {
    say($("driveMsg"), "Download failed.", "err");
  }
}

async function remove(name) {
  if (!confirm("Delete " + name + "?")) return;
  try {
    const r = await call("/api/delete?name=" + encodeURIComponent(name), { method: "DELETE" });
    if (!r.ok) return say($("driveMsg"), "Delete failed (" + r.status + ")", "err");
    refresh();
  } catch (e) {
    say($("driveMsg"), "Delete failed.", "err");
  }
}

$("loginBtn").onclick = () => authenticate("login");
$("registerBtn").onclick = () => authenticate("register");
$("logoutBtn").onclick = logout;
$("uploadBtn").onclick = upload;
$("refreshBtn").onclick = refresh;
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") authenticate("login"); });

// Restore previous session / worker URL
$("apiUrl").value = load("hd_api") || "";
const savedToken = load("hd_token");
if (savedToken && load("hd_api")) { token = savedToken; api = load("hd_api"); showDrive(); }
</script>
</body>
</html>
